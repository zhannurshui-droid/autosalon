$kind: http-request
url: "{{base}}/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('В ответе есть token', () => pm.expect(j.token).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('token', j.token);
      pm.test('Ответ быстрее 2 секунд', () => pm.expect(pm.response.responseTime).to.be.below(2000));
    language: text/javascript
order: 1000
