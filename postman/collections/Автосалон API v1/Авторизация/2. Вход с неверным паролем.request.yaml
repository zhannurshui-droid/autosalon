$kind: http-request
url: "{{base}}/login"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 401 или 422', () => pm.expect([401, 422]).to.include(pm.response.code));
      pm.test('Токена в ответе нет', () => pm.expect(pm.response.json().token).to.be.undefined);
    language: text/javascript
order: 2000
