$kind: http-request
url: "{{base}}/cars/{{car_id}}/bookings"
method: POST
body:
  type: json
  content: |-
    {
      "phone": "+77011234567"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Статус 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
