$kind: http-request
url: "{{base}}/cars/{{car_id}}/bookings"
method: POST
body:
  type: json
  content: |-
    {
      "phone": "+77011234567"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 422', () => pm.response.to.have.status(422));
      pm.test('Есть текст ошибки', () => pm.expect(pm.response.json().message).to.be.a('string').and.not.empty);
    language: text/javascript
order: 2000
