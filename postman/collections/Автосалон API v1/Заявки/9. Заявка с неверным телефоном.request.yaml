$kind: http-request
url: "{{base}}/cars/{{car_id}}/bookings"
method: POST
body:
  type: json
  content: |-
    {
      "phone": "87011234567"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 422', () => pm.response.to.have.status(422));
      pm.test('Ошибка относится к полю phone', () => pm.expect(pm.response.json().errors.phone).to.exist);
    language: text/javascript
order: 3000
